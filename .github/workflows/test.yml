name: CI - Action tests

on:
  push:
    branches:
      - main
      - "releases/*"
  pull_request:
  workflow_dispatch:

jobs:
  input-contract:
    name: Browser input contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/*.test.cjs

  legacy-default:
    name: Deprecated Chrome fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the deprecated browser fallback
        id: setup
        uses: ./

      - name: Verify resolved browsers
        shell: bash
        env:
          INSTALLED_BROWSERS: ${{ steps.setup.outputs.installed-browsers }}
        run: test "$INSTALLED_BROWSERS" = '["chrome"]'

      - name: Verify Playwright installation
        shell: bash
        env:
          PLAYWRIGHT_VERSION: ${{ steps.setup.outputs.playwright-version }}
        run: |
          set -euo pipefail
          playwright --version
          test -n "$PLAYWRIGHT_VERSION"
          test "$PLAYWRIGHT_VERSION" != "unknown"
          node -e "console.log(require('playwright/package.json').version)"

      - name: Launch the fallback Chrome browser
        shell: bash
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true });
            const page = await browser.newPage();
            await page.goto('https://example.com');
            console.log(await page.title());
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

  managed-browser-smoke:
    name: Managed browser (${{ matrix.browser }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
          - os: windows-latest
            browser: firefox
    steps:
      - uses: actions/checkout@v4

      - name: Install the selected managed browser
        id: setup
        uses: ./
        with:
          browsers: ${{ matrix.browser }}

      - name: Launch the selected managed browser
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          INSTALLED_BROWSERS: ${{ steps.setup.outputs.installed-browsers }}
        run: |
          test "$INSTALLED_BROWSERS" = "[\"$BROWSER\"]"
          node - <<'JS'
          const { chromium, firefox, webkit } = require('playwright');
          const browserType = { chromium, firefox, webkit }[process.env.BROWSER];

          (async () => {
            const browser = await browserType.launch({ headless: true });
            const page = await browser.newPage();
            await page.goto('https://example.com');
            console.log(await page.title());
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

  branded-browser-smoke:
    name: Branded browser (${{ matrix.browser }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chrome
          - os: windows-latest
            browser: msedge
    steps:
      - uses: actions/checkout@v4

      - name: Install the selected branded browser
        uses: ./
        with:
          browsers: ${{ matrix.browser }}

      - name: Launch the selected branded browser
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ channel: process.env.BROWSER, headless: true });
            const page = await browser.newPage();
            await page.goto('https://example.com');
            console.log(await page.title());
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

  invalid-input:
    name: Invalid input should fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: bad
        uses: ./
        with:
          browsers: safari
        continue-on-error: true
      - name: Assert action failed on invalid value
        if: always()
        run: |
          echo "Step outcome: ${{ steps.bad.outcome }}"
          test "${{ steps.bad.outcome }}" = "failure"
